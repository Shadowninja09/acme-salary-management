[alembic]
script_location = %(here)s/control_plane_migrations
prepend_sys_path = .
path_separator = os

# Independent of backend/alembic.ini. Leave sqlalchemy.url empty. Set
# CONTROL_PLANE_DATABASE_URL in the environment or the repository .env file.
# Resolution does not use alembic_sqlalchemy_url(), get_db(), SessionLocal,
# or the cached Settings model, and it does not fall back to DATABASE_URL.
# Credentials, privilege separation, and test-database naming are not decided
# here. The version table name is set in control_plane_migrations/env.py from
# CONTROL_PLANE_VERSION_TABLE so it cannot share the assessment table.
# From the repository root, this lists the head without connecting:
#   python -m alembic -c backend/alembic-control-plane.ini heads
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
