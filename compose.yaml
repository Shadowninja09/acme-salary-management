services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the repository-root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the repository-root .env}
    volumes:
      - acme_compose_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env.compose
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in the repository-root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the repository-root .env}
      SESSION_COOKIE_SECURE: "false"
      CSRF_TRUSTED_ORIGINS: '["http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  acme_compose_pgdata:
